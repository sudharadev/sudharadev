<svg xmlns="http://www.w3.org/2000/svg" width="1280" height="360" viewBox="0 0 1280 360" role="img" aria-label="Sudhara Lakshan, Full Stack Developer from Colombo, Sri Lanka">
  <title>Sudhara Lakshan, Full Stack Developer from Colombo, LK</title>
  <defs>
    <pattern id="dots" width="24" height="24" patternUnits="userSpaceOnUse"><circle cx="2" cy="2" r="1.2" fill="#1c1c20"/></pattern>
    <radialGradient id="glow" cx="0.5" cy="0.5" r="0.5">
      <stop offset="0" stop-color="#f5a524" stop-opacity="0.2"/>
      <stop offset="1" stop-color="#f5a524" stop-opacity="0"/>
    </radialGradient>
    <linearGradient id="fade" x1="0" x2="0" y1="0" y2="1">
      <stop offset="0" stop-color="#0b0b0c" stop-opacity="0"/>
      <stop offset="1" stop-color="#0b0b0c" stop-opacity="1"/>
    </linearGradient>
    <clipPath id="r"><rect width="1280" height="360" rx="20"/></clipPath>
  </defs>
  <style>
    .name{font:700 64px ui-sans-serif, -apple-system, 'Segoe UI', Helvetica, Arial, sans-serif;fill:#fafafa;letter-spacing:-2px}
    .label{font:500 15px ui-monospace, SFMono-Regular, Menlo, Consolas, monospace;fill:#7d7d82;letter-spacing:.5px}
    .lead{font:500 26px ui-sans-serif, -apple-system, 'Segoe UI', Helvetica, Arial, sans-serif;fill:#cfcfd1}
    .role{font:600 26px ui-sans-serif, -apple-system, 'Segoe UI', Helvetica, Arial, sans-serif;fill:#f5a524}
    .small{font:400 15px ui-monospace, SFMono-Regular, Menlo, Consolas, monospace;fill:#7d7d82}
    .cmd{font:500 15px ui-monospace, SFMono-Regular, Menlo, Consolas, monospace;fill:#fafafa}
    .outp{font:400 15px ui-monospace, SFMono-Regular, Menlo, Consolas, monospace;fill:#7d7d82}
    .acc{fill:#f5a524} .ok{fill:#4ade80}
    .tbar{font:500 12px ui-monospace, SFMono-Regular, Menlo, Consolas, monospace;fill:#7d7d82}
  </style>
  <g clip-path="url(#r)">
    <rect width="1280" height="360" fill="#0b0b0c"/>
    <rect width="1280" height="360" fill="url(#dots)"/>
    <circle cx="260" cy="170" r="300" fill="url(#glow)">
      <animate attributeName="r" values="280;330;280" dur="8s" repeatCount="indefinite"/>
      <animate attributeName="cx" values="240;300;240" dur="12s" repeatCount="indefinite"/>
    </circle>
    <rect y="260" width="1280" height="100" fill="url(#fade)"/>

    <circle cx="70" cy="83" r="5" fill="#4ade80"><animate attributeName="opacity" values="1;.25;1" dur="1.8s" repeatCount="indefinite"/></circle>
    <text x="86" y="88" class="label">COLOMBO, LK  /  OPEN TO FREELANCE &amp; REMOTE</text>
    <text x="62" y="160" class="name">Sudhara Lakshan</text>
    <text x="64" y="198" class="lead">Full Stack Developer, building with</text>
    <text x="64" y="232" class="role" opacity="1">React &amp; Next.js<animate attributeName="opacity" values="1;1;1;1;0;0" keyTimes="0;0.0333;0.0333;0.2167;0.2500;1" dur="12s" repeatCount="indefinite"/></text>
    <text x="64" y="232" class="role" opacity="0">UI/UX &amp; brand design<animate attributeName="opacity" values="0;0;1;1;0;0" keyTimes="0.0000;0.2500;0.2833;0.4667;0.5000;1.0000" dur="12s" repeatCount="indefinite"/></text>
    <text x="64" y="232" class="role" opacity="0">Founder &amp; tech lead<animate attributeName="opacity" values="0;0;1;1;0;0" keyTimes="0.0000;0.5000;0.5333;0.7167;0.7500;1.0000" dur="12s" repeatCount="indefinite"/></text>
    <text x="64" y="232" class="role" opacity="0">Linux, Docker &amp; cloud<animate attributeName="opacity" values="0;0;1;1;0;0" keyTimes="0.0000;0.7500;0.7833;0.9667;1.0000;1.0000" dur="12s" repeatCount="indefinite"/></text>
    <text x="64" y="300" class="small">sudhara.dev  &#183;  hello@sudhara.dev</text>

    <g>
      <rect x="800" y="56" width="420" height="280" rx="14" fill="#111113" stroke="#26262a"/>
      <line x1="800" y1="94" x2="1220" y2="94" stroke="#26262a"/>
      <circle cx="822" cy="75" r="5.5" fill="#26262a"/><circle cx="840" cy="75" r="5.5" fill="#26262a"/><circle cx="858" cy="75" r="5.5" fill="#26262a"/>
      <text x="1010" y="79" text-anchor="middle" class="tbar">~/sudhara &#8212; zsh</text>
    <text x="824" y="132" class="cmd" opacity="0"><tspan class="acc">$ </tspan>whoami<animate attributeName="opacity" from="0" to="1" begin="0.50s" dur="0.25s" fill="freeze"/></text>
    <text x="824" y="156" class="outp" opacity="0">sudhara lakshan, full stack developer<animate attributeName="opacity" from="0" to="1" begin="0.85s" dur="0.25s" fill="freeze"/></text>
    <text x="824" y="180" class="cmd" opacity="0"><tspan class="acc">$ </tspan>cat location<animate attributeName="opacity" from="0" to="1" begin="1.20s" dur="0.25s" fill="freeze"/></text>
    <text x="824" y="204" class="outp" opacity="0">Colombo, Sri Lanka  (UTC+5:30)<animate attributeName="opacity" from="0" to="1" begin="1.55s" dur="0.25s" fill="freeze"/></text>
    <text x="824" y="228" class="cmd" opacity="0"><tspan class="acc">$ </tspan>ls ./stack<animate attributeName="opacity" from="0" to="1" begin="1.90s" dur="0.25s" fill="freeze"/></text>
    <text x="824" y="252" class="outp" opacity="0">react/  next/  node/  figma/<animate attributeName="opacity" from="0" to="1" begin="2.25s" dur="0.25s" fill="freeze"/></text>
    <text x="824" y="276" class="cmd" opacity="0"><tspan class="acc">$ </tspan>status --now<animate attributeName="opacity" from="0" to="1" begin="2.60s" dur="0.25s" fill="freeze"/></text>
    <text x="824" y="300" class="outp" opacity="0"><tspan class="ok">&#9679; </tspan>available for new projects<animate attributeName="opacity" from="0" to="1" begin="2.95s" dur="0.25s" fill="freeze"/></text>
      <rect x="824" y="310" width="9" height="17" fill="#f5a524" opacity="0">
        <animate attributeName="opacity" values="0;1;1;0;0" keyTimes="0;.01;.5;.51;1" dur="1s" begin="3.4s" repeatCount="indefinite"/>
      </rect>
    </g>
  </g>
  <rect x=".5" y=".5" width="1279" height="359" rx="19.5" fill="none" stroke="#26262a"/>
</svg>
